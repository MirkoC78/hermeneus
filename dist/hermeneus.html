  --r-sm: 10px; --r-md: 16px; --r-lg: 24px; --r-pill: 999px;

    --pri: #9E86FF; --pri-d: #6B4FE0; --pri-l: #BBA9FF; --pri-soft: #2C2546; --on-pri: #16131F;

    --sh-1: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .3);
    --sh-2: 0 4px 12px rgba(0, 0, 0, .4), 0 18px 40px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}

  --paper: #16131F; --paper-2: #221D30; --surface: #1E1A2B; --ink: #EFEAFB; --muted: #ABA3C4; --line: #342D48;
  --feat: #6B4FE0; --feat-2: #5A40C9; --on-feat: #FFFFFF; --on-feat-2: #D9D0FF;
  --pri: #9E86FF; --pri-d: #6B4FE0; --pri-l: #BBA9FF; --pri-soft: #2C2546; --on-pri: #16131F;
  --good: #5FD6A0; --good-d: #2E9D6C; --good-l: #5FD6A0; --good-soft: #17322A;
  --bad: #FF8A8A; --bad-d: #D25458; --bad-soft: #3A1C24;
  --info: #7CC0FF; --info-d: #3D8EF0; --info-soft: #17283F;
  --star: #FFD27A; --star-d: #E0B04E; --star-soft: #3A3018;
  --off: #2E2840; --off-d: #241F33; --on-off: #8A83A3;
  --flame: #FF9B57;
  --g-alf: #C9417A; --g-nom: #6B4FE0; --g-ver: #17855A; --g-pro: #2E70CC; --g-sin: #B8670F;
  --sh-1: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .3);
  --sh-2: 0 4px 12px rgba(0, 0, 0, .4), 0 18px 40px rgba(0, 0, 0, .45);

/* ================= base ================= */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 var(--fs-md)/var(--lh) var(--f-ui); overflow-x: hidden; min-height: 100vh; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

:focus-visible { outline: 3px solid var(--info); outline-offset: 2px; border-radius: var(--r-sm); }
.gr, [lang="grc"] { font-family: var(--f-gr); font-feature-settings: "kern"; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { line-height: var(--lh-tight); text-wrap: balance; }
h1 { font-size: var(--fs-2xl); font-weight: 700; letter-spacing: -.015em; }
h2 { font-size: var(--fs-lg); font-weight: 600; }
h3 { font-size: var(--fs-md); font-weight: 600; }

.muted { color: var(--muted); }
.note { color: var(--muted); font-size: var(--fs-sm); }
.center { text-align: center; }
.eyebrow { font-size: var(--fs-xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: var(--sp-3); }
.stack-lg { display: flex; flex-direction: column; gap: var(--sp-5); }
.row { display: flex; align-items: center; gap: var(--sp-3); }
.grow { flex: 1; min-width: 0; }

/* ================= impaginazione ================= */
.shell { min-height: 100vh; }
.rail, .side { display: none; }
.main { max-width: var(--w-main); margin: 0 auto; padding: 0 var(--gutter-r) calc(var(--sp-9) + 72px + env(safe-area-inset-bottom)) var(--gutter-l); }
.main:focus { outline: none; }
.view { display: flex; flex-direction: column; gap: var(--sp-6); padding-top: var(--sp-5); }
.sec { display: flex; flex-direction: column; gap: var(--sp-3); }
.sec > .eyebrow { padding-inline: var(--sp-1); }
.page-head { display: flex; flex-direction: column; gap: var(--sp-2); }
.page-head .lede { color: var(--muted); }
.topbar { position: sticky; top: 0; z-index: 20; margin: 0 calc(-1 * var(--gutter-r)) 0 calc(-1 * var(--gutter-l)); padding: env(safe-area-inset-top, 0px) var(--gutter-r) 0 var(--gutter-l); background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.topbar .bar-in { display: flex; align-items: center; gap: var(--sp-3); height: var(--h-lg); }
.brand { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
.brand .mark { width: 32px; height: 32px; flex: none; }
.brand b { font: 400 var(--fs-xl)/1 var(--f-grd); color: var(--ink); white-space: nowrap; }
.top-stats { margin-left: auto; display: flex; gap: var(--sp-2); }
.chip { display: inline-flex; align-items: center; gap: var(--sp-1); height: 32px; padding: 0 var(--sp-3) 0 var(--sp-2); border-radius: var(--r-pill); background: var(--paper-2); font-weight: 600; font-size: var(--fs-sm); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip svg { width: 18px; height: 18px; flex: none; }
.chip.streak svg { color: var(--flame); }
.chip.streak.off, .chip.streak.off svg { color: var(--muted); }
.chip.xp svg { color: var(--star); }
.tabs { position: fixed; z-index: 30; inset: auto 0 0; display: flex; justify-content: center; padding: var(--sp-1) var(--gutter-r) calc(var(--sp-1) + env(safe-area-inset-bottom)) var(--gutter-l); background: var(--surface); border-top: 1px solid var(--line); }
.tabs button { flex: 1; max-width: 112px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 60px; border: 0; background: none; color: var(--muted); font-size: var(--fs-xs); font-weight: 500; }
.tabs button svg { width: 24px; height: 24px; padding: 4px 16px; box-sizing: content-box; border-radius: var(--r-pill); transition: background .15s; }
.tabs button[aria-current="page"] { color: var(--pri-d); font-weight: 600; }
.tabs button[aria-current="page"] svg { background: var(--pri-soft); }
@media (min-width: 1000px) {
  .shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); }
  .rail { display: flex; flex-direction: column; gap: var(--sp-1); position: sticky; top: 0; height: 100vh; padding: var(--sp-6) var(--sp-3); background: var(--surface); border-right: 1px solid var(--line); }
  .rail .brand { padding: 0 var(--sp-3) var(--sp-6); }
  .rail button { display: flex; align-items: center; gap: var(--sp-3); height: var(--h-lg); padding: 0 var(--sp-3); border-radius: var(--r-md); border: 0; background: none; color: var(--muted); font-weight: 500; text-align: left; }
  .rail button svg { width: 24px; height: 24px; flex: none; }
  .rail button .gr { display: block; font-size: var(--fs-sm); font-weight: 400; color: var(--on-off); line-height: 1.1; }
  .rail button:hover { background: var(--paper-2); color: var(--ink); }
  .rail button[aria-current="page"] { background: var(--pri-soft); color: var(--pri); font-weight: 600; }
  .tabs { display: none; }
  .topbar { background: color-mix(in srgb, var(--paper) 92%, transparent); border-bottom: 0; }
  .topbar .brand { display: none; }
  .topbar .chip { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
  .main { padding-bottom: var(--sp-9); }
}
@media (min-width: 1280px) {
  .shell { grid-template-columns: 240px minmax(0, 1fr) 340px; }
  .side { display: flex; flex-direction: column; gap: var(--sp-4); position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: var(--sp-6) var(--sp-6) var(--sp-6) 0; }
  .main .only-narrow { display: none; }
}

/* ================= componenti ================= */
/* scheda */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--sp-4); }
.card.hero { border-radius: var(--r-lg); padding: var(--sp-5); box-shadow: var(--sh-1); border-color: transparent; }
.card.flush { padding: 0; overflow: hidden; }
.card > h2 + * { margin-top: var(--sp-2); }

/* pulsanti */
.btn { --c: var(--pri); --cd: var(--pri-d); --t: var(--on-pri); display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2); height: var(--h-md); padding: 0 var(--sp-5); border-radius: var(--r-md); border: 0; background: var(--c); color: var(--t); font: 600 var(--fs-md)/1 var(--f-ui); letter-spacing: .01em; text-decoration: none; white-space: nowrap; box-shadow: 0 var(--depth) 0 var(--cd); margin-bottom: var(--depth); transition: transform .08s ease, box-shadow .08s ease, filter .15s; }
.btn:hover { filter: brightness(1.05); }
.btn:active { transform: translateY(var(--depth)); box-shadow: 0 0 0 var(--cd); }
.btn.big { height: var(--h-lg); font-size: var(--fs-lg); padding: 0 var(--sp-6); }
.btn.small { height: var(--h-sm); padding: 0 var(--sp-4); font-size: var(--fs-sm); }
.btn.block { width: 100%; }
.btn.ghost { --c: var(--surface); --cd: var(--off-d); --t: var(--pri); box-shadow: inset 0 0 0 2px var(--line), 0 var(--depth) 0 var(--off-d); }
.btn.ghost:active { box-shadow: inset 0 0 0 2px var(--line); }
.btn.ok { --c: var(--good); --cd: var(--good-d); --t: #fff; }
.btn.err { --c: var(--bad); --cd: var(--bad-d); --t: #fff; }
.btn.on-color { --c: rgba(255, 255, 255, .2); --cd: rgba(0, 0, 0, .15); --t: #fff; }
.btn:disabled { --c: var(--off); --cd: var(--off-d); --t: var(--on-off); cursor: default; filter: none; }
.btn svg { width: 20px; height: 20px; flex: none; }
:root[data-theme="dark"] .btn.ok, :root[data-theme="dark"] .btn.err { --t: #16131F; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.ok, :root:not([data-theme="light"]) .btn.err { --t: #16131F; } }
.btns { display: flex; gap: var(--sp-3); }
.btns > .btn { flex: 1; }
.iconbtn { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--r-pill); border: 0; background: transparent; color: var(--muted); flex: none; }
.iconbtn:hover { background: var(--paper-2); color: var(--ink); }
.iconbtn svg { width: 24px; height: 24px; }
.iconbtn.outline { background: var(--surface); box-shadow: inset 0 0 0 2px var(--line); color: var(--pri); }
.iconbtn.outline[aria-pressed="true"] { background: var(--info-soft); box-shadow: inset 0 0 0 2px var(--info); color: var(--info); }
.linkbtn { align-self: flex-start; background: none; border: 0; padding: var(--sp-2) 0; color: var(--pri); font-weight: 600; font-size: var(--fs-sm); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1.5px; }
/* pulsante testo con icona (strumenti) */
.tool { display: inline-flex; align-items: center; gap: var(--sp-2); height: var(--h-sm); padding: 0 var(--sp-3); border-radius: var(--r-pill); border: 0; box-shadow: inset 0 0 0 1.5px var(--off-d); background: var(--surface); color: var(--ink); font-size: var(--fs-sm); font-weight: 500; text-decoration: none; white-space: nowrap; }
.tool svg { width: 18px; height: 18px; color: var(--pri); }
.tool:hover { box-shadow: inset 0 0 0 1.5px var(--pri-l); }
.tools { display: flex; flex-wrap: wrap; gap: var(--sp-2); }

/* contrassegni */
.tag { display: inline-flex; align-items: center; height: 24px; padding: 0 var(--sp-2); border-radius: var(--r-pill); background: var(--paper-2); color: var(--muted); font-size: var(--fs-xs); font-weight: 600; }
.tag.new { background: var(--star-soft); color: var(--star-d); }
.tag.pri { background: var(--pri-soft); color: var(--pri); }
.count { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; padding: 0 var(--sp-2); border-radius: var(--r-pill); background: var(--bad); color: #fff; font-size: var(--fs-xs); font-weight: 700; }

/* barre */
.bar { height: 10px; border-radius: var(--r-pill); background: var(--paper-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--star); border-radius: var(--r-pill); transition: width .5s cubic-bezier(.3, 1.4, .5, 1); }
.bar.pri > i { background: var(--pri); }

/* righe di elenco */
.list { list-style: none; margin: 0; padding: 0; }
.list > li + li { border-top: 1px solid var(--line); }
.rowbtn { display: flex; align-items: center; gap: var(--sp-3); width: 100%; min-height: 64px; padding: var(--sp-3) var(--sp-4); background: none; border: 0; text-align: left; color: var(--ink); }
.rowbtn:hover { background: color-mix(in srgb, var(--paper-2) 60%, transparent); }
.rowbtn:disabled { opacity: .5; cursor: default; background: none; }
.rowbtn .ico, .rowbtn .num { width: 40px; height: 40px; flex: none; border-radius: var(--r-pill); display: flex; align-items: center; justify-content: center; }
.rowbtn .ico { background: var(--pri-soft); color: var(--pri); }
.rowbtn .ico svg { width: 22px; height: 22px; }
.rowbtn .ico.gr-ico { font: 400 var(--fs-lg)/1 var(--f-grd); }
.rowbtn .num { background: var(--gc, var(--pri)); color: #fff; font: 400 var(--fs-lg)/1 var(--f-grd); }
.rowbtn .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.rowbtn .txt b { font-weight: 600; line-height: var(--lh-tight); }
.rowbtn .txt span { color: var(--muted); font-size: var(--fs-sm); line-height: 1.35; }
.rowbtn .chev { width: 20px; height: 20px; color: var(--on-off); flex: none; }
.g-alf { --gc: var(--g-alf); } .g-nom { --gc: var(--g-nom); } .g-ver { --gc: var(--g-ver); } .g-pro { --gc: var(--g-pro); } .g-sin { --gc: var(--g-sin); }

/* controlli di scelta */
.chips { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.chips button { height: var(--h-sm); padding: 0 var(--sp-4); border-radius: var(--r-pill); border: 0; box-shadow: inset 0 0 0 1.5px var(--off-d); background: var(--surface); font-weight: 500; font-size: var(--fs-sm); }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: var(--sp-1); padding: var(--sp-1); border-radius: var(--r-md); background: var(--paper-2); }
.seg button { height: var(--h-sm); padding: 0 var(--sp-2); border: 0; border-radius: calc(var(--r-md) - var(--sp-1)); background: transparent; color: var(--muted); font-weight: 500; font-size: var(--fs-sm); white-space: nowrap; font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--pri); font-weight: 600; box-shadow: 0 1px 2px rgba(43, 36, 64, .12), 0 0 0 1.5px var(--pri-l); }
.field { display: flex; flex-direction: column; gap: var(--sp-2); }
.field > label, .field > .label { font-size: var(--fs-sm); font-weight: 600; }
.select { position: relative; }
.select select { width: 100%; height: var(--h-md); padding: 0 var(--sp-7) 0 var(--sp-4); border-radius: var(--r-md); border: 0; box-shadow: inset 0 0 0 1.5px var(--off-d); background: var(--surface); font-weight: 500; -webkit-appearance: none; appearance: none; }
.select::after { content: ''; position: absolute; right: var(--sp-4); top: 50%; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.select select:focus-visible { outline: 3px solid var(--info); outline-offset: 2px; }
.switch { position: relative; width: 52px; height: 32px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: var(--r-pill); background: var(--off-d); transition: background .2s; pointer-events: none; }
.switch i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
.switch input:checked + i { background: var(--good-l); }
.switch input:checked + i::after { transform: translateX(20px); }
.switch input:focus-visible + i { outline: 3px solid var(--info); outline-offset: 2px; }
.setting { display: flex; align-items: center; gap: var(--sp-4); padding: var(--sp-3) var(--sp-4); min-height: 64px; }
.setting + .setting { border-top: 1px solid var(--line); }
.setting > .grow b { display: block; font-weight: 500; }
.setting > .grow span { display: block; color: var(--muted); font-size: var(--fs-sm); line-height: 1.35; margin-top: 2px; }
.setting.wrap { flex-wrap: wrap; }
.setting.wrap > .seg { flex: 1 1 100%; }
.typed { width: 100%; min-height: var(--h-lg); padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md); border: 0; box-shadow: inset 0 0 0 1.5px var(--off-d); background: var(--surface); font-size: var(--fs-lg); resize: vertical; }
.typed.gr { font-family: var(--f-gr); font-size: var(--fs-xl); }
.typed:focus { box-shadow: inset 0 0 0 2px var(--pri); outline: none; }

/* ================= Ermes ================= */
.ermes { display: block; flex: none; overflow: visible; }
.ermes .wing { transform-box: fill-box; }
.ermes .wing.l { transform-origin: 100% 80%; }
.ermes.bob .figure { animation: bob 3.4s ease-in-out infinite; }
.ermes.bob .wing.l { animation: flut 3.4s ease-in-out infinite; }
.ermes.cheer .wing.l { animation: flap .45s ease-in-out 4; }
.ermes.cheer { animation: hop .6s ease-out 2; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
@keyframes flut { 0%, 80%, 100% { transform: rotate(0); } 88% { transform: rotate(-12deg); } }
@keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-10px); } }
@keyframes flap { 50% { transform: rotate(-24deg); } }
.say { display: flex; align-items: flex-end; gap: var(--sp-3); }
.bubble { position: relative; flex: 1; min-width: 0; padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md) var(--r-md) var(--r-md) var(--sp-1); background: var(--surface); border: 1px solid var(--line); line-height: var(--lh); }
.bubble .gr { font-size: 1.1em; }

/* ================= percorso ================= */
.resume { display: flex; flex-direction: column; gap: var(--sp-4); }
.resume-top { display: flex; align-items: center; gap: var(--sp-4); }
.resume-top .ermes { width: 76px; height: 76px; }
.resume-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-1); }
.resume-txt h2 { font-size: var(--fs-xl); font-weight: 700; }
.resume-txt .note { line-height: 1.35; }
.lesson-dots { display: flex; gap: var(--sp-1); }
.lesson-dots i { flex: 1; height: 8px; border-radius: var(--r-pill); background: var(--off); }
.lesson-dots i.on { background: var(--good-l); }
.lesson-dots i.cur { background: var(--pri); }


.goal { display: flex; align-items: center; gap: var(--sp-4); }
.goal .ring { width: 56px; height: 56px; flex: none; }
.goal .grow { display: flex; flex-direction: column; gap: var(--sp-2); }
.goal b { font-weight: 600; }
.unit { display: flex; flex-direction: column; margin-top: var(--sp-2); }
.unit-banner { display: flex; align-items: center; gap: var(--sp-3); min-height: 80px; padding: var(--sp-3) var(--sp-3) var(--sp-3) var(--sp-4); border-radius: var(--r-lg); background: var(--gc, var(--pri)); color: #fff; box-shadow: 0 var(--depth) 0 color-mix(in srgb, var(--gc, var(--pri)) 70%, #000); }
.unit-banner .unum { flex: none; width: 48px; height: 48px; border-radius: var(--r-pill); display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, .2); font: 400 var(--fs-xl)/1 var(--f-grd); }
.unit-banner .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.unit-banner small { font-size: var(--fs-xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #fff; opacity: .9; }

/* ================= palestra ================= */

.custom { display: flex; flex-direction: column; gap: var(--sp-4); }

/* ================= lezione ================= */
.overlay { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; background: var(--paper); }
.ov-inner { flex: 1; overflow-y: auto; overflow-x: hidden; }
.ov-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: var(--sp-3); max-width: var(--w-lesson); margin: 0 auto; padding: calc(var(--sp-2) + env(safe-area-inset-top)) var(--gutter-r) var(--sp-2) calc(var(--gutter-l) - var(--sp-2)); background: var(--paper); }

.ex-head { display: flex; flex-direction: column; gap: var(--sp-2); }
.ex-tags { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.prompt { font-size: var(--fs-xl); font-weight: 700; line-height: var(--lh-tight); text-wrap: balance; }
.prompt .lemma { display: block; margin-top: var(--sp-1); font: 400 var(--fs-md)/1.3 var(--f-gr); color: var(--muted); }

.greek-line .blank { display: inline-block; min-width: 3.4em; border-bottom: 3px solid var(--pri); text-align: center; color: var(--pri); }
.ex-tools { display: flex; gap: var(--sp-2); }

#aux:empty { display: none; }
.answer { min-height: 116px; display: flex; flex-wrap: wrap; gap: var(--sp-2); align-content: flex-start; padding: var(--sp-1) 0; background-image: repeating-linear-gradient(to bottom, transparent 0 56px, var(--line) 56px 58px); }

.tile:active { transform: translateY(var(--depth)); box-shadow: inset 0 0 0 1.5px var(--off-d); }

.tile.used { background: var(--off); box-shadow: none; transform: translateY(var(--depth)); color: transparent; pointer-events: none; }
.composed { font-family: var(--f-gr); font-size: var(--fs-lg); color: var(--muted); min-height: 1.6em; }
.opts { display: grid; gap: var(--sp-3); }
.opt { display: flex; align-items: center; gap: var(--sp-3); min-height: var(--h-lg); padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md); border: 0; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--off-d), 0 var(--depth) 0 var(--off-d); margin-bottom: var(--depth); color: var(--ink); font-size: var(--fs-lg); text-align: left; transition: transform .08s, box-shadow .12s; }
.opt:active { transform: translateY(var(--depth)); box-shadow: inset 0 0 0 1.5px var(--off-d); }

.opt.gr { font-family: var(--f-gr); font-size: var(--fs-xl); }

.opt.right { background: var(--good-soft); color: var(--good); box-shadow: inset 0 0 0 2px var(--good-l), 0 var(--depth) 0 var(--good-d); }

.bigform { font-family: var(--f-gr); font-size: var(--fs-3xl); line-height: 1.2; text-align: center; padding: var(--sp-4) 0 0; }

/* schede di spiegazione */
.teach { display: flex; flex-direction: column; gap: var(--sp-4); }

.bubble.big { flex: none; max-width: 30rem; padding: var(--sp-4) var(--sp-5); border-radius: var(--r-lg); font-size: var(--fs-lg); text-align: center; box-shadow: var(--sh-1); border-color: transparent; }
.bubble.big::before { content: ''; position: absolute; top: -7px; left: 50%; width: 14px; height: 14px; background: var(--surface); transform: translateX(-50%) rotate(45deg); border-radius: 2px; }
.teach .lesson-text { font-size: var(--fs-lg); line-height: 1.55; }
.teach .ex { display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-4); border-radius: var(--r-md); background: var(--pri-soft); }
.teach .ex .gr { font-size: var(--fs-xl); }
/* tastiera greca */
.kb { padding: var(--sp-2); border-radius: var(--r-md); background: var(--paper-2); user-select: none; -webkit-user-select: none; display: flex; flex-direction: column; gap: 6px; }
.kb-row { display: flex; gap: var(--sp-1); justify-content: center; }

.kb button.dia { background: var(--pri-soft); color: var(--pri-d); font-size: var(--fs-2xl); }
.kb button.wide { max-width: 140px; flex-grow: 3; font: 500 var(--fs-sm)/1 var(--f-ui); }
.kb button.del { max-width: 72px; flex-grow: 1.6; font: 400 var(--fs-xl)/1 var(--f-ui); }
.kb button:active { transform: translateY(2px); box-shadow: none; }
.kb-hint { font-size: var(--fs-xs); color: var(--muted); text-align: center; }
/* barra in basso */
.ov-foot { background: var(--surface); border-top: 1px solid var(--line); padding: var(--sp-4) var(--gutter-r) calc(var(--sp-4) + env(safe-area-inset-bottom)) var(--gutter-l); }
.ov-foot.ok { background: var(--good-soft); border-top-color: transparent; }
.ov-foot.err { background: var(--bad-soft); border-top-color: transparent; }
.foot-in { max-width: var(--w-lesson); margin: 0 auto; display: flex; flex-direction: column; gap: var(--sp-3); }
.foot-hint { text-align: center; color: var(--muted); font-size: var(--fs-sm); padding: var(--sp-3) 0; }
.fb { display: flex; gap: var(--sp-3); align-items: flex-start; }

.sol { font-weight: 600; font-size: var(--fs-lg); }
.sol.gr { font-family: var(--f-gr); font-size: var(--fs-xl); font-weight: 400; }

@media (min-width: 420px) { .fb-extra { padding-left: calc(52px + var(--sp-3)); } }
.fb-extra .tool { height: 36px; background: transparent; }

@media (min-width: 700px) {
  .opts.two { grid-template-columns: 1fr 1fr; }
  .foot-split { display: flex; gap: var(--sp-5); align-items: center; }
  .foot-split .fb-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-3); }
  .foot-split > .btn { flex: 0 0 220px; }
}
@media (max-width: 699px) { .foot-split { display: flex; flex-direction: column; gap: var(--sp-3); } .fb-wrap { display: flex; flex-direction: column; gap: var(--sp-3); } }
/* fine lezione */
.done-screen { display: flex; flex-direction: column; align-items: center; gap: var(--sp-4); text-align: center; padding-top: var(--sp-4); }

.done-screen .card .medal { width: 52px; height: 52px; }

.stats3 { width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-3); }
.stat { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-1); min-height: 84px; padding: var(--sp-3) var(--sp-2); border-radius: var(--r-md); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); text-align: center; }
.stat b { font-size: var(--fs-xl); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; color: var(--c, var(--ink)); }
.stat small { font-size: var(--fs-xs); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.stat svg { width: 22px; height: 22px; color: var(--c, var(--pri)); }
.bigstars { display: flex; justify-content: center; gap: var(--sp-2); }
.bigstars svg { width: 44px; height: 44px; color: var(--off-d); }
.bigstars svg.on { color: var(--star); animation: starpop .5s cubic-bezier(.3, 1.6, .5, 1) both; }
.bigstars svg.on:nth-child(2) { animation-delay: .15s; } .bigstars svg.on:nth-child(3) { animation-delay: .3s; }
@keyframes starpop { from { transform: scale(.2) rotate(-30deg); opacity: 0; } to { transform: none; opacity: 1; } }

/* ================= teoria, tabelle, fogli ================= */
.theory { display: flex; flex-direction: column; gap: var(--sp-3); }
.theory p { max-width: 65ch; }

.tbl-wrap { overflow-x: auto; border-radius: var(--r-md); box-shadow: inset 0 0 0 1px var(--line); background: var(--surface); -webkit-overflow-scrolling: touch; }

.tip, .trap { padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md); font-size: var(--fs-sm); display: flex; flex-direction: column; gap: var(--sp-1); }
.tip { background: var(--info-soft); }
.trap { background: var(--star-soft); }
.tip b, .trap b { font-size: var(--fs-xs); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.tip b { color: var(--info); } .trap b { color: var(--star-d); }
.exline { display: flex; flex-direction: column; gap: 2px; padding: var(--sp-2) 0; border-top: 1px solid var(--line); }
.exline .gr { font-size: var(--fs-lg); }
.pop { position: fixed; z-index: 70; width: min(340px, calc(100vw - 24px)); display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-4); border-radius: var(--r-md); background: var(--surface); box-shadow: var(--sh-2), 0 0 0 1px var(--line); }
.pop h4 { margin: 0; font: 400 var(--fs-2xl)/1.15 var(--f-gr); }
.pop .lem { color: var(--muted); font-size: var(--fs-sm); }
.pop ul { margin: 0; padding-left: var(--sp-5); font-size: var(--fs-sm); }
.pop .tools { margin-top: var(--sp-1); }
.sheet-bg { position: fixed; inset: 0; z-index: 80; display: flex; align-items: flex-end; justify-content: center; background: rgba(22, 19, 31, .5); }

<div id="app" class="app"><noscript><p style="padding:20px">Hermeneus ha bisogno di JavaScript attivo nel browser.</p></noscript></div>
<script>window.HERM_SITE = false;</script>
<script>
/* ---- src/greek.js ---- */
/* HERMENEUS — ortografia greca: Unicode politonico, sillabe, quantità, accenti.
   Notazione dei dati: dopo una vocale «_» = lunga, «^» = breve (solo per α ι υ; η ω sempre lunghe, ε ο brevi).
   «+» separa due vocali che si contraggono; «|» separa il preverbio dal tema. */
(function (root) {
  'use strict';

  const PSILI = '\u0313', DASIA = '\u0314', ACUTE = '\u0301', GRAVE = '\u0300', CIRC = '\u0342';
  const ISUB = '\u0345', DIAER = '\u0308', MACRON = '\u0304', BREVE = '\u0306';
  const VOW = 'αεηιουω';
  const isV = (b) => VOW.includes(b);

  /* ---------- Normalizzazione ---------- */
  // NFC: tonos e oxia diventano lo stesso carattere (U+1F71 → U+03AC); sigma finale; ; e · greci.
  const GR = 'Ͱ-Ͽἀ-῿\u0300-\u036F';
  const RE_FINAL = new RegExp('σ(?![' + GR + 'A-Za-z])', 'g');
  const RE_MID = new RegExp('ς(?=[' + GR + '])', 'g');
  function nfc(s) {
    s = String(s).normalize('NFC');
    if (/[ϲϹ’ʼ᾿᾽]/.test(s)) {
      s = s.replace(/ϲ/g, 'σ').replace(/Ϲ/g, 'Σ').replace(/[’ʼ᾿᾽]/g, '’');
    }
    if (s.indexOf('σ') >= 0) s = s.replace(RE_FINAL, 'ς');
    if (s.indexOf('ς') >= 0) s = s.replace(RE_MID, 'σ');
    return s;
  }
  // chiave di ricerca: niente segni diacritici, minuscolo, sigma unico (le forme in ingresso sono già NFC)
  function bare(s) {
    return String(s).normalize('NFD').replace(/[\u0300-\u036F]/g, '').toLowerCase().replace(/ς/g, 'σ').replace(/[^α-ω]/g, '');
  }
  // chiave di confronto stretto (in NFD): grave = acuto, dieresi e quantità ignorate
  function strict(s) {
    return String(s).normalize('NFD').replace(/\u0300/g, ACUTE).replace(/[\u0308\u0304\u0306]/g, '').toLowerCase().replace(/ς/g, 'σ');
  }
  // senza accenti ma con spiriti e iota sottoscritto
  function noAccent(s) {
    return nfc(s).normalize('NFD').replace(/[\u0300\u0301\u0342\u0308\u0304\u0306]/g, '').normalize('NFC');
  }

  /* ---------- Lettere ---------- */
  // ogni lettera: b base minuscola, up maiuscola, br spirito (s|r), ac accento (a|g|c), is iota sottoscritto, di dieresi, q quantità (L|S)
  function parse(word) {
    const out = [];
    const d = String(word).normalize('NFD');
    for (const ch of d) {
      const L = out[out.length - 1];
      switch (ch) {
        case PSILI: if (L) L.br = 's'; continue;
        case DASIA: if (L) L.br = 'r'; continue;
        case ACUTE: if (L) L.ac = 'a'; continue;
        case GRAVE: if (L) L.ac = 'g'; continue;
        case CIRC: if (L) L.ac = 'c'; continue;
        case ISUB: if (L) L.is = true; continue;
        case DIAER: if (L) L.di = true; continue;
        case MACRON: case '_': if (L) L.q = 'L'; continue;
        case BREVE: case '^': if (L) L.q = 'S'; continue;
        default: break;
      }
      if (/[\u0300-\u036F]/.test(ch)) continue;
      if (ch === '+' || ch === '|') { out.push({ b: ch, mark: true }); continue; }
      const lo = ch.toLowerCase();
      out.push({ b: lo === 'ς' ? 'σ' : lo, up: lo !== ch, br: '', ac: '', is: false, di: false, q: '' });
    }
    return out;
  }
  function serialize(L) {
    let s = '';
    const letters = L.filter((l) => !l.mark);
    letters.forEach((l, i) => {
      let b = l.b;
      if (b === 'σ' && (i === letters.length - 1)) b = 'ς';
      if (l.up) b = b.toUpperCase();
      s += b;
      if (l.di) s += DIAER;
      if (l.br) s += l.br === 's' ? PSILI : DASIA;
      if (l.ac) s += l.ac === 'a' ? ACUTE : l.ac === 'g' ? GRAVE : CIRC;
      if (l.is) s += ISUB;
    });
    return s.normalize('NFC');
  }
  const clone = (L) => L.map((l) => ({ ...l }));

  /* ---------- Sillabe (nuclei vocalici) ---------- */
  const DIPH = { ι: 'αεου', υ: 'αεηο' };
  function nuclei(L) {
    const N = [];
    for (let i = 0; i < L.length; i++) {
      const l = L[i];
      if (l.mark || !isV(l.b)) continue;
      const nx = L[i + 1];
      if (nx && !nx.mark && !nx.di && !l.is && !l.ac && !l.br && l.q !== 'L' &&
        ((nx.b === 'ι' && (DIPH.ι.includes(l.b) || l.b === 'υ')) || (nx.b === 'υ' && DIPH.υ.includes(l.b)))) {
        N.push({ i, j: i + 1, diph: true });
        i++;
        continue;
      }
      N.push({ i, j: i, diph: false });
    }
    return N;
  }
  // o.optLong: -αι/-οι finali lunghi (ottativo)
  function isLong(L, n, isLast, o = {}) {
    const a = L[n.i], b = L[n.j];
    if (n.diph) {
      if (isLast && !o.optLong && (a.b === 'α' || a.b === 'ο') && b.b === 'ι') {
        const rest = L.slice(n.j + 1).filter((x) => !x.mark);
        if (!rest.length) return false;
      }
      return true;
    }
    if (a.is || a.b === 'η' || a.b === 'ω') return true;
    if (a.b === 'ε' || a.b === 'ο') return false;
    if (a.ac === 'c') return true;
    return a.q === 'L';
  }
  function clearAccents(L) { L.forEach((l) => { if (!l.mark) l.ac = ''; }); return L; }
  function setAccent(L, n, type) {
    const target = L[n.j];
    if (type === 'c' && !isLongNucleus(L, n)) throw new Error('circonflesso su vocale breve: ' + serialize(L));
    target.ac = type;
  }
  function isLongNucleus(L, n) {
    const a = L[n.i];
    if (n.diph) return true;
    return a.is || a.b === 'η' || a.b === 'ω' || a.q === 'L' || a.ac === 'c';
  }
  function accentInfo(L) {
    const N = nuclei(L);
    for (let k = N.length - 1; k >= 0; k--) {
      const ac = L[N[k].j].ac || L[N[k].i].ac;
      if (ac) return { pos: N.length - 1 - k, type: ac, n: N.length, idx: k };
    }
    return { pos: -1, type: '', n: N.length, idx: -1 };
  }

  /* ---------- Regole d'accento ---------- */
  // accento recessivo (verbi). o.min: indice minimo del nucleo (preverbio, aumento)
  function recessive(L, o = {}) {
    clearAccents(L);
    const N = nuclei(L);
    const n = N.length;
    if (!n) return L;
    const ultLong = isLong(L, N[n - 1], true, o);
    let k, type = 'a';
    if (n === 1) { k = 0; type = ultLong ? 'c' : 'a'; }
    else if (ultLong) k = n - 2;
    else if (n >= 3) k = n - 3;
    else { k = n - 2; type = isLong(L, N[k], false, o) ? 'c' : 'a'; }
    if (o.min != null && k < o.min) k = Math.min(o.min, n - 1);
    if (k === n - 2 && n >= 2) type = isLong(L, N[k], false, o) && !ultLong ? 'c' : 'a';
    if (k === n - 1 && n > 1) type = 'a';
    if (k === n - 3) type = 'a';
    setAccent(L, N[k], type);
    return L;
  }
  // accento persistente: anchor = indice del nucleo accentato nel lemma (da sinistra)
  // o.circUlt: circonflesso se l'accento cade sull'ultima lunga (gen. e dat. degli ossitoni)
  function persistent(L, anchor, o = {}) {
    clearAccents(L);
    const N = nuclei(L);
    const n = N.length;
    if (!n) return L;
    const ultLong = o.ultShort ? false : isLong(L, N[n - 1], true, o);
    const minK = Math.max(0, ultLong ? n - 2 : n - 3);
    let k = Math.min(Math.max(anchor, minK), n - 1);
    let type = 'a';
    if (k === n - 1) type = o.circUlt && ultLong ? 'c' : 'a';
    else if (k === n - 2) type = isLong(L, N[k], false, o) && !ultLong ? 'c' : 'a';
    setAccent(L, N[k], type);
    return L;
  }
  // accento fisso su una sillaba contata dalla fine (1 = ultima), tipo automatico
  function fixedFromEnd(L, pos, o = {}) {
    clearAccents(L);
    const N = nuclei(L);
    const n = N.length;
    const k = n - pos;
    const ultLong = isLong(L, N[n - 1], true, o);
    let type = o.type || 'a';
    if (!o.type) {
      if (pos === 2) type = isLong(L, N[k], false, o) && !ultLong ? 'c' : 'a';
      if (pos === 1) type = 'a';
    }
    setAccent(L, N[k], type);
    return L;
  }

  /* ---------- Contrazione ---------- */
  const CONTR = {
    α: { ε: 'α_', η: 'α_', ει: 'ᾳ', ῃ: 'ᾳ', ο: 'ω', ω: 'ω', ου: 'ω', οι: 'ῳ', ε$: 'α_' },
    ε: { ε: 'ει', η: 'η', ει: 'ει', ῃ: 'ῃ', ο: 'ου', ω: 'ω', ου: 'ου', οι: 'οι', ε$: 'ει' },
    ο: { ε: 'ου', η: 'ω', ει: 'οι', ῃ: 'οι', ο: 'ου', ω: 'ω', ου: 'ου', οι: 'οι', ε$: 'ου' },
  };
  // o.spurious: la vocale dopo «+» è il dittongo improprio -ειν dell'infinito (= ε + ε)
  function contract(L, o = {}) {
    let p;
    while ((p = L.findIndex((l) => l.mark && l.b === '+')) >= 0) {
      const v1 = L[p - 1];
      const after = L.slice(p + 1);
      const N2 = nuclei(after);
      const n2 = N2[0];
      if (!v1 || !n2 || n2.i !== 0) { L.splice(p, 1); continue; }
      let key = after[0].b + (n2.diph ? after[1].b : '');
      if (!n2.diph && after[0].is) key = after[0].b === 'η' ? 'ῃ' : after[0].b + 'ι';
      if (o.spurious && key === 'ει') key = 'ε$';
      const res = CONTR[v1.b] && CONTR[v1.b][key];
      if (!res) throw new Error('contrazione sconosciuta ' + v1.b + '+' + key);
      const acFirst = !!v1.ac;
      const acSecond = !!(after[n2.j].ac || after[0].ac);
      const R = parse(res);
      if (v1.br) R[0].br = v1.br;
      if (v1.up) R[0].up = true;
      const last = R[R.length - 1];
      if (acFirst) last.ac = 'c';
      else if (acSecond) last.ac = 'a';
      const consumed = n2.j + 1;
      L.splice(p - 1, 2 + consumed, ...R);
    }
    return L;
  }

  /* ---------- Funzioni di comodo su stringhe ---------- */
  const strip = (s) => serialize(parse(s)); // toglie quantità e marcatori
  function rec(s, o) { const L = parse(s); recessive(L, o); contract(L, o); return serialize(L); }
  function pers(s, anchor, o) { const L = parse(s); persistent(L, anchor, o); contract(L, o); return serialize(L); }
  function fixedEnd(s, pos, o) { const L = parse(s); fixedFromEnd(L, pos, o); contract(L, o); return serialize(L); }
  // indice del nucleo accentato (da sinistra) di una forma
  function anchorOf(s) { const L = parse(s); const a = accentInfo(L); return a.idx; }
  function syllables(s) { return nuclei(parse(s)).length; }
  // tipo d'accento: ossitona, perispomena, parossitona, properispomena, proparossitona, atona
  function accentClass(s) {
    const a = accentInfo(parse(s));
    if (a.pos < 0) return 'atona';
    if (a.pos === 0) return a.type === 'c' ? 'perispomena' : 'ossitona';
    if (a.pos === 1) return a.type === 'c' ? 'properispomena' : 'parossitona';
    return 'proparossitona';
  }
  // aggiunge l'acuto sull'ultima (davanti a enclitica)
  function addUltimaAcute(s) {
    const L = parse(s);
    const N = nuclei(L);
    if (!N.length) return s;
    L[N[N.length - 1].j].ac = 'a';
    return serialize(L);
  }
  function toGrave(s) {
    const L = parse(s);
    const N = nuclei(L);
    if (!N.length) return s;
    const last = L[N[N.length - 1].j];
    if (last.ac === 'a') last.ac = 'g';

    M.s.forEach((f, i) => push(i === 0 ? G.strip(masc) : f, CASES[i], 's', 'm'));
    M.p.forEach((f, i) => push(f, CASES[i], 'p', 'm'));
    if (fem) {
      // fem === 'auto': -ᾱ dopo ε ι ρ, altrimenti -η
      const pureA = fem === 'auto' ? /[ειρ]$/.test(G.stripAccents(G.strip(stem))) : !bareEnd(fem).endsWith('η');
      const fe = pureA ? ['α_', 'α_ς', 'ᾳ', 'α_ν', 'α_'] : ['η', 'ης', 'ῃ', 'ην', 'η'];
      const F = themeForms(stem, anchor, fe, ['αι', 'ων', 'αις', 'α_ς', 'αι'], { oxy });
      F.s.forEach((f, i) => push(f, CASES[i], 's', 'f'));
      F.p.forEach((f, i) => push(f, CASES[i], 'p', 'f'));
    } else {
      M.s.forEach((f, i) => push(i === 0 ? G.strip(masc) : f, CASES[i], 's', 'f'));
      M.p.forEach((f, i) => push(f, CASES[i], 'p', 'f'));
    }
    const nE = o.pronN ? ['ο', 'ου', 'ῳ', 'ο', 'ο'] : D1['2n']()[0];
    const Nn = themeForms(stem, anchor, nE, D1['2n']()[1], { oxy });
    Nn.s.forEach((f, i) => push(f, CASES[i], 's', 'n'));
    Nn.p.forEach((f, i) => push(f, CASES[i], 'p', 'n'));
    return out;
  }
  // seconda classe e comparativi in -ων (accento recessivo)
  function adjOnForms(masc, o = {}) {
    const stem = stemOf(masc, 2); // εὐδαιμ
    const out = [];
    const push = (f, c, n, g, nu) => { if (f) out.push({ f: G.nfc(f), c, n, g, nu: !!nu }); };
    const r = (end) => R(stem + end);
    for (const g of ['m', 'f']) {
      push(G.strip(masc), 'nom', 's', g);
      push(r('ονος'), 'gen', 's', g);
      push(r('ονι'), 'dat', 's', g);
      push(r('ονα'), 'acc', 's', g);
      if (o.comp) push(r('ω'), 'acc', 's', g);
      push(r('ον'), 'voc', 's', g);
      push(r('ονες'), 'nom', 'p', g);
      if (o.comp) push(r('ους'), 'nom', 'p', g);
      push(r('ονων'), 'gen', 'p', g);
      push(r('οσι'), 'dat', 'p', g, true);
      push(r('ονας'), 'acc', 'p', g);
      if (o.comp) push(r('ους'), 'acc', 'p', g);
      push(r('ονες'), 'voc', 'p', g);
    }
    push(r('ον'), 'nom', 's', 'n'); push(r('ονος'), 'gen', 's', 'n'); push(r('ονι'), 'dat', 's', 'n'); push(r('ον'), 'acc', 's', 'n'); push(r('ον'), 'voc', 's', 'n');
    for (const c of ['nom', 'acc', 'voc']) { push(r('ονα'), c, 'p', 'n'); if (o.comp) push(r('ω'), c, 'p', 'n'); }
    push(r('ονων'), 'gen', 'p', 'n'); push(r('οσι'), 'dat', 'p', 'n', true);
    return out;
  }
  function adjEsForms(masc) {
    const stem = stemOf(masc, 2); // ἀληθ
    const out = [];
    const push = (f, c, n, g, nu) => out.push({ f: FX(stem, f), c, n, g, nu: !!nu });
    for (const g of ['m', 'f']) {
      ['ής', 'οῦς', 'εῖ', 'ῆ', 'ές'].forEach((x, i) => push(x, CASES[i], 's', g));
      ['εῖς', 'ῶν', 'έσι', 'εῖς', 'εῖς'].forEach((x, i) => push(x, CASES[i], 'p', g, i === 2));
    }
    ['ές', 'οῦς', 'εῖ', 'ές', 'ές'].forEach((x, i) => push(x, CASES[i], 's', 'n'));
    ['ῆ', 'ῶν', 'έσι', 'ῆ', 'ῆ'].forEach((x, i) => push(x, CASES[i], 'p', 'n', i === 2));
    return out;
  }
  function adjUsForms(masc) {
    const stem = stemOf(masc, 2); // ἡδ
    const out = [];
    const push = (f, c, n, g, nu) => out.push({ f: FX(stem, f), c, n, g, nu: !!nu });
    ['ύς', 'έος', 'εῖ', 'ύν', 'ύ'].forEach((x, i) => push(x, CASES[i], 's', 'm'));
    ['εῖς', 'έων', 'έσι', 'εῖς', 'εῖς'].forEach((x, i) => push(x, CASES[i], 'p', 'm', i === 2));
    ['εῖα', 'εί_ας', 'είᾳ', 'εῖαν', 'εῖα'].forEach((x, i) => push(x, CASES[i], 's', 'f'));
    ['εῖαι', 'ειῶν', 'εί_αις', 'εί_ας', 'εῖαι'].forEach((x, i) => push(x, CASES[i], 'p', 'f'));
    ['ύ', 'έος', 'εῖ', 'ύ', 'ύ'].forEach((x, i) => push(x, CASES[i], 's', 'n'));
    ['έα', 'έων', 'έσι', 'έα', 'έα'].forEach((x, i) => push(x, CASES[i], 'p', 'n', i === 2));
    return out;
  }
  // tabelle complete: "m: 5|5 ; f: 5|5 ; n: 5|5" con celle separate da spazi, "-" = manca
  function fullGendered(spec) {
    const out = [];
    spec.split(';').forEach((part) => {
      const [g, rest] = part.split(':').map((x) => x.trim());
      if (!rest) return;
      const [s, p] = rest.split('|').map((x) => x.trim().split(/\s+/));
      (s || []).forEach((x, i) => cell(x).forEach((y) => out.push({ f: y.f, c: CASES[i], n: 's', g, nu: y.nu })));
      (p || []).forEach((x, i) => cell(x).forEach((y) => out.push({ f: y.f, c: CASES[i], n: 'p', g, nu: y.nu })));
    });
    return out;
  }
  const DEG_IT = { pos: '', cmp: 'comparativo, ', sup: 'superlativo, ' };
  function addAdj(line) {
    const [masc, fem, neut, m, flags] = line;
    const fl = parseFlags(flags);
    let topic = fl.topic || 'agg1';
    if (!fl.full && (fl.tpl === 'es' || fl.tpl === 'us' || fl.tpl === 'on')) topic = fl.topic || 'agg2';
    const gen1 = () => {
    let raw;
    if (fl.full) { raw = fullGendered(fl.full); }
    else if (fl.tpl === 'es') raw = adjEsForms(masc);
    else if (fl.tpl === 'us') raw = adjUsForms(masc);
    else if (fl.tpl === 'on') raw = adjOnForms(masc);
    else raw = adj1Forms(masc, fem, neut, { pronN: !!fl.pronN });
    const forms = raw.map((x) => form(x.f, `a.pos.${x.g}.${x.c}.${x.n}`, nominalDesc(x.c, x.n, x.g), [topic], { c: x.c, n: x.n, g: x.g, deg: 'pos', nu: x.nu }));
    const degree = (list, deg) => {
      if (!list) return;
      list.split('/').forEach((w) => {
        const b = bareEnd(w);
        let rr;
        if (b.endsWith('ων')) rr = adjOnForms(w, { comp: true });
        else rr = adj1Forms(w, 'auto', null);
        rr.forEach((x) => forms.push(form(x.f, `a.${deg}.${x.g}.${x.c}.${x.n}`, DEG_IT[deg] + nominalDesc(x.c, x.n, x.g), ['agg2'], { c: x.c, n: x.n, g: x.g, deg, nu: x.nu, dl: G.strip(w) })));
      });
    };
    degree(fl.cmp, 'cmp');
    degree(fl.sup, 'sup');
    return forms;
    };
    const lemma = [masc, fem, neut].filter(Boolean).map((x) => G.strip(x)).join(', ');
    return register({ k: 'a', lemma: G.strip(masc), head: lemma, m, topic, fl, cmp: fl.cmp, sup: fl.sup }, gen1);
  }

  /* ---------- Pronomi ---------- */
  function addPron(id, head, m, topic, spec, extra = {}) {
    const raw = fullGendered(spec);
    const forms = raw.map((x) => form(x.f, `p.${x.g}.${x.c}.${x.n}`, nominalDesc(x.c, x.n, x.g === 'x' ? null : x.g), [topic],
      { c: x.c, n: x.n, g: x.g, nu: x.nu, encl: extra.encl ? extra.encl(x.f) : false, noGrave: !!extra.noGrave }));
    return register({ k: 'p', pid: id, lemma: head.split(',')[0].trim(), head, m, topic, forms, encl: !!extra.encl, noGrave: !!extra.noGrave });
  }

  /* ---------- Verbi ---------- */
  const E = {
    indA: ['ω', 'εις', 'ει', 'ομεν', 'ετε', 'ουσι(ν)'],
    indM: ['ομαι', 'ῃ/ει', 'εται', 'ομεθα', 'εσθε', 'ονται'],
    impfA: ['ον', 'ες', 'ε(ν)', 'ομεν', 'ετε', 'ον'],
    impfM: ['ομην', 'ου', 'ετο', 'ομεθα', 'εσθε', 'οντο'],
    subjA: ['ω', 'ῃς', 'ῃ', 'ωμεν', 'ητε', 'ωσι(ν)'],
    subjM: ['ωμαι', 'ῃ', 'ηται', 'ωμεθα', 'ησθε', 'ωνται'],
    optA: ['οιμι', 'οις', 'οι', 'οιμεν', 'οιτε', 'οιεν'],
    optAc: ['οίην*', 'οίης*', 'οίη*', 'οιμεν', 'οιτε', 'οιεν'],
    optM: ['οιμην', 'οιο', 'οιτο', 'οιμεθα', 'οισθε', 'οιντο'],
    impA: ['ε', 'ετω', 'ετε', 'οντων'],
    impM: ['ου', 'εσθω', 'εσθε', 'εσθων'],
    a1A: ['α', 'ας', 'ε(ν)', 'αμεν', 'ατε', 'αν'],
    a1M: ['αμην', 'ω', 'ατο', 'αμεθα', 'ασθε', 'αντο'],
    a1optA: ['αιμι', 'αις/ειας', 'αι/ειε(ν)', 'αιμεν', 'αιτε', 'αιεν/ειαν'],
    a1optM: ['αιμην', 'αιο', 'αιτο', 'αιμεθα', 'αισθε', 'αιντο'],
    a1impA: ['ον', 'ατω', 'ατε', 'αντων'],
    a1impM: ['αι', 'ασθω', 'ασθε', 'ασθων'],
    a2impM: ['οῦ*', 'εσθω', 'εσθε', 'εσθων'],
    pInd: ['ην', 'ης', 'η', 'ημεν', 'ητε', 'ησαν'],
    pSubj: ['ῶ*', 'ῇς*', 'ῇ*', 'ῶμεν*', 'ῆτε*', 'ῶσι(ν)*'],
    pOpt: ['είην*', 'είης*', 'είη*', 'εῖμεν*/είημεν*', 'εῖτε*/είητε*', 'εῖεν*/είησαν*'],
    pImp: ['ητι', 'ητω', 'ητε', 'εντων'],
    pfA: ['α', 'ας', 'ε(ν)', 'αμεν', 'ατε', 'α_σι(ν)'],
    pfM: ['μαι', 'σαι', 'ται', 'μεθα', 'σθε', 'νται'],
  };
  // conta i nuclei prima di «|» per i limiti d'accento dei composti
  function prefixNuclei(stem) {
    const i = stem.indexOf('|');
    if (i < 0) return null;
    return G.nuclei(G.parse(stem.slice(0, i))).length;
  }
  function vdesc(t, m, v, p) {
    let s = TENSE_IT[t] + ' ' + MOOD_IT[m];
    if (v) s += ' ' + VOICE_IT[v];
    if (p) s += ', ' + PERS_IT[p];
    return s;
  }
  // mode: all | nopart (senza participi) | part (solo participi)
  function verbForms(v, mode = 'all') {
    const out = [];
    const ctype = (stem) => (stem && stem.endsWith('+') ? G.parse(stem.slice(0, -1)).filter((l) => !l.mark).slice(-1)[0].b : null);
    const base = (v.tags || []).slice();
    const dep = v.dep; // 'm' deponente medio, 'p' deponente passivo
    const vo = (act) => (act ? 'act' : 'mp');
    const reqFor = (t, m, voice, extra = []) => {
      const r = new Set(base);
      if (t === 'pres') r.add(voice === 'act' ? 'pres' : 'mp');
      if (t === 'impf') { r.add('impf'); if (voice !== 'act') r.add('mp'); }
      if (t === 'fut') { r.add('fut'); if (voice !== 'act') r.add('mp'); }
      if (t === 'aor') { r.add('aor'); if (voice === 'mid') r.add('mp'); }
      if (t === 'futp') { r.add('aor'); r.add('mp'); }
      if (t === 'pf') { r.add('perf'); if (voice !== 'act') r.add('mp'); }
      if (m === 'subj' || m === 'opt') r.add('cong');
      if (m === 'part') r.add('part');
      if (v.ctype) r.add('contr');
      if (v.mi) r.add('mi');
      extra.forEach((x) => r.add(x));
      return [...r];
    };
    const no = new Set((v.no || '').split(/[\s,]+/).filter(Boolean));
    const skip = (key) => [...no].some((k) => key === k || key.startsWith(k + '.'));
    const emit = (f, key, d, req, extra) => { if (!skip(key)) out.push(form(f, key, d, req, extra)); };

    // applica una lista di desinenze a un tema
    // mode: rec | fix (desinenza accentata, '*') ; aug: forma aumentata
    function run(stem, ends, persons, mk, o = {}) {
      if (!stem || mode === 'part') return;
      const pre = prefixNuclei(stem);
      const min = pre == null ? null : (o.aug ? pre : pre - 1);
      ends.forEach((spec, i) => {
        spec.split('/').forEach((alt) => {
          // nei contratti la ε della 3ª sing. si fonde col tema: niente ν efelcistico (ἐτίμα, ἐποίει)
          const nu = /\(ν\)/.test(alt) && !(stem.endsWith('+') && /^ε\(ν\)$/.test(alt));
          let end = alt.replace('(ν)', '');
          const fixed = end.endsWith('*');
          end = end.replace('*', '');
          let f;
          if (fixed) f = FX(stem, end, o);
          else if (o.fixedEnd) f = G.fixedEnd(stem + end, o.fixedEnd, o);
          else f = R(stem + end, Object.assign({}, o, { min }));
          mk(f, persons[i], nu);
        });
      });
    }
    // participio di tipo III-I-III: desinenze [masc, gen, fem, neut, datpl] ('*' = accentata); anchor dal maschile
    function participle3(stem, spec, t, voice) {
      if (!stem || mode === 'nopart') return;
      const cl = (s) => s.replace('*', '').replace('(ν)', '');
      const [mN, mG, fN, nN, dP] = spec;
      const pre = prefixNuclei(stem);
      let anchor;
      if (mN.endsWith('*')) anchor = G.accentInfo(G.parse(unacc(stem) + cl(mN))).idx;
      else { const L = G.parse(stem + cl(mN)); G.recessive(L, { min: pre == null ? null : pre - 1 }); anchor = G.accentInfo(L).idx; }
      const pp = (s) => P(stem + s, anchor);
      const ms = cl(mG).replace(/ος$/, '');
      const fs = cl(fN).replace(/α$/, '');
      const femPure = /ι$/.test(G.stripAccents(G.strip(fs)));
      const rows = [];
      const add = (f, g, c, n, nu) => rows.push({ f, g, c, n, nu });
      for (const g of ['m', 'n']) {
        const nom = g === 'm' ? pp(cl(mN)) : pp(cl(nN));
        add(nom, g, 'nom', 's'); add(pp(ms + 'ος'), g, 'gen', 's'); add(pp(ms + 'ι'), g, 'dat', 's');
        add(g === 'm' ? pp(ms + 'α') : nom, g, 'acc', 's'); add(nom, g, 'voc', 's');
        const np = g === 'm' ? pp(ms + 'ες') : pp(ms + 'α');
        add(np, g, 'nom', 'p'); add(pp(ms + 'ων'), g, 'gen', 'p'); add(pp(cl(dP)), g, 'dat', 'p', true);
        add(g === 'm' ? pp(ms + 'ας') : np, g, 'acc', 'p'); add(np, g, 'voc', 'p');
      }
      (femPure ? ['α', 'α_ς', 'ᾳ', 'αν', 'α'] : ['α', 'ης', 'ῃ', 'αν', 'α']).forEach((x, i) => add(pp(fs + x), 'f', CASES[i], 's'));
      ['αι', null, 'αις', 'α_ς', 'αι'].forEach((x, i) => add(x ? pp(fs + x) : FX(stem + fs, 'ῶν'), 'f', CASES[i], 'p'));
      const tt = t === 'futp' ? 'fut' : t;
      for (const r of rows) {
        emit(r.f, `${t}.part.${voice}.${r.g}.${r.c}.${r.n}`, `participio ${TENSE_IT[tt]} ${VOICE_IT[voice]}, ${nominalDesc(r.c, r.n, r.g)}`,
          reqFor(t, 'part', voice, ['d3']), { c: r.c, n: r.n, g: r.g, nu: r.nu, t: tt, m: 'part', v: voice });
      }
    }
    // participio in -μενος (aggettivo della prima classe)
    function participleMenos(stem, end, t, voice) {
      if (!stem || mode === 'nopart') return;
      const fixed = end.endsWith('*');
      const e0 = end.replace('*', '');
      const pre = prefixNuclei(stem);
      let anchor;
      if (fixed) anchor = G.accentInfo(G.parse(unacc(stem) + e0)).idx;
      else { const L = G.parse(stem + e0); G.recessive(L, { min: pre == null ? null : pre - 1 }); anchor = G.accentInfo(L).idx; }
      const st = unacc(stem + e0.replace(/ος$/, ''));
      const rows = [];
      const M = themeForms(st, anchor, D1['2']()[0], D1['2']()[1], {});
      const F = themeForms(st, anchor, ['η', 'ης', 'ῃ', 'ην', 'η'], ['αι', 'ων', 'αις', 'α_ς', 'αι'], {});
      const N = themeForms(st, anchor, D1['2n']()[0], D1['2n']()[1], {});
      [['m', M], ['f', F], ['n', N]].forEach(([g, T]) => {
        T.s.forEach((f, i) => rows.push({ f, g, c: CASES[i], n: 's' }));
        T.p.forEach((f, i) => rows.push({ f, g, c: CASES[i], n: 'p' }));
      });
      const tt = t === 'futp' ? 'fut' : t;
      for (const r of rows) {
        emit(r.f, `${t}.part.${voice}.${r.g}.${r.c}.${r.n}`, `participio ${TENSE_IT[tt]} ${VOICE_IT[voice]}, ${nominalDesc(r.c, r.n, r.g)}`,
          reqFor(t, 'part', voice, ['agg1']), { c: r.c, n: r.n, g: r.g, t: tt, m: 'part', v: voice });
      }
    }
    const fin = (t, m, voice, tKey) => (f, p, nu) => {
      const key = `${tKey || t}.${m}.${voice}.${p}`;
      emit(f, key, vdesc(t === 'futp' ? 'fut' : t, m, voice, p), reqFor(tKey || t, m, voice), { t: t === 'futp' ? 'fut' : t, m, v: voice, p, nu, encl: false });
    };
    const inf = (t, voice, tKey) => (f) => emit(f, `${tKey || t}.inf.${voice}`, `infinito ${TENSE_IT[t === 'futp' ? 'fut' : t]} ${VOICE_IT[voice]}`, reqFor(tKey || t, 'inf', voice), { t: t === 'futp' ? 'fut' : t, m: 'inf', v: voice });

    /* --- presente e imperfetto --- */
    const pres = v.pres;
    if (pres) {
      const c = ctype(pres);
      const o = {};
      const actOK = !dep;
      const mpVoice = 'mp';
      if (actOK) {
        run(pres, E.indA, PERS, fin('pres', 'ind', 'act'));
        run(pres, E.subjA, PERS, fin('pres', 'subj', 'act'));
        run(pres, c ? E.optAc : E.optA, PERS, fin('pres', 'opt', 'act'), { optLong: true });
        run(pres, E.impA, IMP_P, fin('pres', 'imp', 'act'));
        run(pres, ['ειν'], ['x'], inf('pres', 'act'), { spurious: !!c });
        participle3(pres, ['ων', 'οντος', 'ουσα', 'ον', 'ουσι(ν)'], 'pres', 'act');
      }
      if (!v.noMP) {
        run(pres, E.indM, PERS, fin('pres', 'ind', mpVoice));
        run(pres, E.subjM, PERS, fin('pres', 'subj', mpVoice));
        run(pres, E.optM, PERS, fin('pres', 'opt', mpVoice), { optLong: true });
        run(pres, E.impM, IMP_P, fin('pres', 'imp', mpVoice));
        run(pres, ['εσθαι'], ['x'], inf('pres', mpVoice));
        participleMenos(pres, 'ομενος', 'pres', mpVoice);
      }
      if (v.impf) {
        if (actOK) run(v.impf, E.impfA, PERS, fin('impf', 'ind', 'act'), { aug: true });
        if (!v.noMP) run(v.impf, E.impfM, PERS, fin('impf', 'ind', mpVoice), { aug: true });
      }
      if (v.impf2) {
        if (actOK) run(v.impf2, E.impfA, PERS, fin('impf', 'ind', 'act'), { aug: true });
        if (!v.noMP) run(v.impf2, E.impfM, PERS, fin('impf', 'ind', mpVoice), { aug: true });
      }
    }
    /* --- futuro --- */
    if (v.fut) {
      const c = ctype(v.fut);
      const actOK = !v.futM;
      if (actOK) {
        run(v.fut, E.indA, PERS, fin('fut', 'ind', 'act'));
        run(v.fut, c ? E.optAc : E.optA, PERS, fin('fut', 'opt', 'act'), { optLong: true });
        run(v.fut, ['ειν'], ['x'], inf('fut', 'act'), { spurious: !!c });
        participle3(v.fut, ['ων', 'οντος', 'ουσα', 'ον', 'ουσι(ν)'], 'fut', 'act');
      }
      if (v.futM || v.futMid) {
        run(v.fut, E.indM, PERS, fin('fut', 'ind', 'mid'));
        run(v.fut, E.optM, PERS, fin('fut', 'opt', 'mid'), { optLong: true });
        run(v.fut, ['εσθαι'], ['x'], inf('fut', 'mid'));
        participleMenos(v.fut, 'ομενος', 'fut', 'mid');
      }
    }
    /* --- aoristo primo --- */
    if (v.aor1) {
      const act = !v.aorM;
      if (act) {
        run(v.aor1a, E.a1A, PERS, fin('aor', 'ind', 'act'), { aug: true });
        run(v.aor1, E.subjA, PERS, fin('aor', 'subj', 'act'));
        run(v.aor1, E.a1optA, PERS, fin('aor', 'opt', 'act'), { optLong: true });
        run(v.aor1, E.a1impA, IMP_P, fin('aor', 'imp', 'act'));
        run(v.aor1, ['αι'], ['x'], inf('aor', 'act'), { fixedEnd: 2 });
        participle3(v.aor1, ['α_ς', 'αντος', 'α_σα', 'αν', 'α_σι(ν)'], 'aor', 'act');
      }
      if (v.aorM || v.aorMid) {
        run(v.aor1a, E.a1M, PERS, fin('aor', 'ind', 'mid'), { aug: true });
        run(v.aor1, E.subjM, PERS, fin('aor', 'subj', 'mid'));
        run(v.aor1, E.a1optM, PERS, fin('aor', 'opt', 'mid'), { optLong: true });
        run(v.aor1, E.a1impM, IMP_P, fin('aor', 'imp', 'mid'));
        run(v.aor1, ['ασθαι'], ['x'], inf('aor', 'mid'));
        participleMenos(v.aor1, 'αμενος', 'aor', 'mid');

  }
  // genitivo assoluto (participio presente) + principale
  function bGenAbs(ctx) {

    const itFn = (ch, reg) => {
      const sl = (k, nn) => { reg(k, nn); return ch(k); };
      const v = n.it[sl('g', n.it.length) % n.it.length];
      const g = num === 'p' ? v.gpl : v.g;
      const w = num === 'p' ? v.pl : v.sg;
      const art = IT.defArt(g, num, w);
      const past = main.tokens.some((t) => t.a && t.a.m === 'ind' && (t.a.t === 'aor' || t.a.t === 'impf'));
      const sub = 'mentre ' + art + (art.endsWith("'") ? '' : ' ') + w + ' ' + itVerb(V, sl('r', V.it.length), past ? 'impf' : 'pres', { p: num === 'p' ? 5 : 2 });
      const m = main.it[sl('m', main.it.length) % main.it.length];

  }
  // verbo servile o dichiarativo + infinito
  function bInf(ctx) {
    const say = ctx.T.has('inf') && chance(0.5);
    const M = pick(VERBS.filter((v) => (say ? v.say : v.inf) && vOK(ctx, v)));
    if (!M) return null;
    const V = pick(VERBS.filter((v) => v.o && !v.inf && !v.say && vOK(ctx, v)));
    if (!V) return null;
    const sNP = mkNP(ctx, M.s);
    if (!sNP) return null;
    const gp = grSubjPers(sNP);
    const tt = chooseTense(ctx, M, false, gp);
    if (!tt || (say && tt.t !== 'pres')) return null;
    const iv = activeVoice(V, 'pres', 'ind', '3s');
    const inf = iv && formKey(V.e, `pres.inf.${iv === 'mid' ? 'mp' : iv}`);
    if (!inf) return null;
    const oNP = mkNP(ctx, V.o, { avoid: [sNP.n] });
    if (!oNP) return null;
    let aNP = null;
    if (say) { aNP = mkNP(ctx, V.s, { avoid: [sNP.n, oNP.n], adj: false }); if (!aNP) return null; }
    const sT = grNP(sNP, 'nom'), oT = grNP(oNP, V.oc || 'acc'), aT = aNP ? grNP(aNP, 'acc') : [];
    if (!sT || !oT || !aT) return null;
    const toks = [...sT, S.tok(tt.f), ...aT, ...oT, S.tok(inf)];
    const itFn = (ch, reg) => {
      const sl = (k, n) => { reg(k, n); return ch(k); };
      const sI = itNP(sNP, sl('s', sNP.n.it.length));
      const itT = TENSE[tt.t].it[sl('t', TENSE[tt.t].it.length) % TENSE[tt.t].it.length];
      let s = itStr(sI) + ' ' + itVerb(M, sl('m', M.it.length), itT, { p: subjP(sNP) });
      if (say) {
        const aI = itNP(aNP, sl('a', aNP.n.it.length));

  }
  // proposizione finale: «il comandante manda i soldati affinché custodiscano la città»
  function bFinal(ctx) {
    const PEMPO = VERBS.find((v) => v.la === 'πέμπω');
    const sNP = mkNP(ctx, 'rul fam civ', { adj: false });
    const oNP = mkNP(ctx, 'msg mil srv', { avoid: sNP ? [sNP.n] : [], adj: false });

  // soggetto con una relativa: «il soldato, che rimane nella città, custodisce la casa»

    const V2 = pick(VERBS.filter((v) => v.pp && !v.o && !v.req && v.la !== 'ἀποθνῄσκω' && vOK(ctx, v)));

  // μέν… δέ: due proposizioni contrapposte, con soggetti diversi e lo stesso tempo

  function tipFor(ctx, tt) {
    const f = tt.f;
    if (f.t === 'aor') return 'Aoristo indicativo: passato remoto o passato prossimo.';
    if (f.t === 'impf') return 'Imperfetto: l’aumento indica un tempo storico.';
    if (f.t === 'fut') return 'Futuro: il σ (o ψ, ξ) prima della desinenza.';
    if (f.t === 'pf') return 'Perfetto: raddoppiamento, stato raggiunto.';

  }

  // costruttori adatti a ciascun argomento (con pesi)
  const BY_FOCUS = {
    art: [[bBasic, 1], [bPhrase, 1]], d1: [[bBasic, 2], [bCopula, 1], [bPhrase, 1]], pres: [[bBasic, 3], [bImper, 1], [bCopula, 1]], d2: [[bBasic, 2], [bCopula, 1], [bPhrase, 1]],

  const SPECIAL = { agg2: (ctx) => bCopula(ctx, { cmp: true }) };

  function generate(selected, focus, o = {}) {
    init();
    const T = new Set(selected);

    const topics = [...T].filter((t) => BY_FOCUS[t]);

    for (let attempt = 0; attempt < 80; attempt++) {
      const f = focus && T.has(focus) && attempt < 50 ? focus : pick(topics);

      let s = null;

        if (noVerb || (o.phrase && chance(0.5))) s = bPhrase(ctx);
        else if (o.simple && chance(0.5)) s = (chance(0.5) ? bBasic : bCopula)(ctx);

          let r = rand() * tot, fn = list[0][0];
          for (const [b, w] of list) { r -= w; if (r <= 0) { fn = b; break; } }

        }

/* HERMENEUS — motore delle lezioni: costruisce gli esercizi di ogni lezione dentro il suo perimetro
   (argomenti sbloccati, vocabolario già incontrato, forme ammesse). Nessun accesso al DOM: si usa anche nei test. */
(function (root) {
  'use strict';
  const E = root.HermEngine || require('./morph.js');
  const SN = root.HermSentence || require('./sentence.js');
  const GN = root.HermGen || require('./generator.js');
  const C = root.HERM_COURSE || require('./course.js');
  const G = E.G;
  const ORDER = SN.ORDER;

  let rand = Math.random;
  const rnd = (n) => Math.floor(rand() * n);
  const pick = (a) => a[rnd(a.length)];
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const uniq = (a) => [...new Set(a)];

  /* ---------- Struttura del percorso ---------- */
  const FLAT = [];
  C.UNITS.forEach((u, ui) => u.lessons.forEach((l, li) => FLAT.push({ unit: u, lesson: l, ui, li, idx: FLAT.length })));
  const BY_ID = Object.fromEntries(FLAT.map((x) => [x.lesson.id, x]));
  const UNIT_BY_ID = Object.fromEntries(C.UNITS.map((u, i) => [u.id, Object.assign({ i }, u)]));
  const entryOf = (lemma) => { const n = G.nfc(lemma); return E.LEX.find((e) => e.lemma === n && e.k !== 'art') || null; };

  // argomenti fino all'unità della lezione (compresa)
  function topicsUpTo(lessonId) {
    const x = BY_ID[lessonId];
    return new Set(C.UNITS.slice(0, x.ui + 1).map((u) => u.id));
  }
  // vocabolario incontrato fino alla lezione (compresa)
  function vocabUpTo(lessonId) {
    const x = BY_ID[lessonId];
    const v = new Set();
    for (const f of FLAT.slice(0, x.idx + 1)) for (const l of f.lesson.lemmas || []) v.add(G.nfc(l));
    return v;
  }
  // vocabolario dei soli argomenti scelti (pratica libera)

    { p: `<b>Vocali</b>: ${x('ε ο')} sono sempre brevi, ${x('η ω')} sempre lunghe; ${x('α ι υ')} possono essere brevi o lunghe (si dicono <i>ancipiti</i>). <b>Dittonghi</b>: ${x('αι ει οι υι αυ ευ ηυ ου')}. Lo <b>iota sottoscritto</b> (${x('ᾳ ῃ ῳ')}) non si pronuncia.` },
    { p: `<b>Spiriti</b>. Ogni parola che comincia per vocale ha uno spirito: dolce (${x('ἀ')}, nessun suono) o aspro (${x('ἁ')}, una h aspirata). Nei dittonghi lo spirito sta sulla seconda vocale: ${g('οἰκία')}. ${x('υ')} e ${x('ρ')} iniziali hanno sempre lo spirito aspro: ${g('ὑπό')}, ${g('ῥήτωρ')}.` },
    { p: `<b>Accenti</b>: acuto (${x('ά')}), grave (${x('ὰ')}), circonflesso (${x('ᾶ')}). Le leggi: l’accento non risale oltre la terzultima sillaba, e sulla terzultima solo se l’ultima è breve; il circonflesso cade solo su vocale lunga e non oltre la penultima; se la penultima lunga è accentata e l’ultima è breve, l’accento è circonflesso (${g('δῶρον')}, ma ${g('δώρου')}). In fine di parola <b>-αι</b> e <b>-οι</b> contano come brevi (tranne nell’ottativo).` },
    { p: `Secondo la posizione dell’accento le parole sono <b>ossitone</b> (${g('ποταμός')}), <b>parossitone</b> (${g('λόγος')}), <b>proparossitone</b> (${g('ἄνθρωπος')}), <b>perispomene</b> (${g('θεοῦ')}), <b>properispomene</b> (${g('δῶρον')}). Nella frase l’acuto dell’ossitona diventa grave davanti a un’altra parola: ${g('ὁ ποταμὸς ῥεῖ')}.` },
    { p: `<b>Proclitiche</b> (${g('ὁ')}, ${g('ἡ')}, ${g('ἐν')}, ${g('εἰς')}, ${g('ἐκ')}, ${g('εἰ')}, ${g('ὡς')}, ${g('οὐ')}) si appoggiano alla parola seguente e non hanno accento; <b>enclitiche</b> (${g('τις')}, ${g('μου')}, le forme di ${g('εἰμί')} e di ${g('φημί')} al presente) si appoggiano alla precedente e le cedono l’accento: ${g('ἄνθρωπός τις')}.` },
    { p: `<b>Interpunzione</b>: il punto e la virgola come in italiano; il punto in alto (·) vale due punti o punto e virgola; il punto e virgola (;) è il punto interrogativo: ${g('τί λέγεις;')} = «che cosa dici?».` },

  tip: 'Leggi sempre ad alta voce, sillaba per sillaba: accento e quantità si imparano con l’orecchio. Tocca il pulsante della voce per sentire la lettura erasmiana.',
  trap: ['ν (ny) somiglia alla v latina, ρ (rho) alla p, η (eta) alla n: guarda bene la forma.', 'Lo spirito aspro conta come una lettera: ὁ (articolo) e ὅ (relativo) sono parole diverse.'],

/* ---------- Stato ---------- */
const KEY = 'hermeneus.v1';
const DEFAULT = () => ({
  v: 2, onboarded: false, name: '', topics: [], goal: 50, xp: 0, days: {}, streak: 0, lastDay: null, shields: 0,
  mastery: {}, mistakes: [], badges: {}, vocab: {}, recent: [], genSaved: [], backupAt: 0, savedAt: 0,

  settings: { sound: true, voice: true, input: 'tiles', accents: 'lenient', theme: 'auto', gen: true, online: true },

let S = DEFAULT();
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    const def = DEFAULT();
    S = Object.assign(def, d, { stats: Object.assign(def.stats, d.stats || {}), settings: Object.assign(def.settings, d.settings || {}), course: Object.assign(def.course, d.course || {}), prac: Object.assign(def.prac, d.prac || {}) });
    // dalla versione 1: gli argomenti scelti diventano unità aperte del percorso
    if (d.v !== 2 && d.onboarded) { placeAt(ORDER.filter((t) => (d.topics || []).includes(t)).pop() || null); S.v = 2; }
    syncTopics();
  } catch (e) { /* archiviazione non disponibile */ }
}
let saveFailed = false;
function save() { try { S.savedAt = Date.now(); localStorage.setItem(KEY, JSON.stringify(S)); saveFailed = false; } catch (e) { saveFailed = true; } }
function applyTheme() {
  const r = document.documentElement;
  if (S.settings.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.settings.theme);
  const dark = S.settings.theme === 'dark' || (S.settings.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  const m = $('meta[name="theme-color"]');
  if (m) m.content = dark ? '#1E1A2B' : '#FFFFFF';
}

/* ---------- Percorso: sblocchi ---------- */
function unitIdx(id) { return UNITS.findIndex((u) => u.id === id); }
function firstLessonIdx(ui) { return FLAT.findIndex((f) => f.ui === ui); }
function lastLessonIdx(ui) { return FLAT.map((f) => f.ui).lastIndexOf(ui); }
// colloca lo studente: le unità fino a quella indicata sono aperte, si riparte dalla successiva
function placeAt(unitId) {
  const ui = unitId ? unitIdx(unitId) : -1;
  S.course.unlocked = ui < 0 ? 0 : Math.min(FLAT.length - 1, lastLessonIdx(ui) + 1);
  syncTopics();
}
function syncTopics() {
  const lastUi = FLAT[Math.min(S.course.unlocked, FLAT.length - 1)].ui;
  S.topics = UNITS.slice(0, lastUi + 1).map((u) => u.id);
}
const isUnlocked = (idx) => idx <= S.course.unlocked;
const currentIdx = () => Math.min(S.course.unlocked, FLAT.length - 1);
const sel = () => new Set(S.topics);

/* ---------- Token ---------- */
function resolveTok(t) {
  if (!Array.isArray(t)) return t;
  if (t.length === 1) return { p: t[0] };
  const e = E.LEX[t[0]];
  let a = e && e.forms.find((x) => x.key === t[1] && x.f === t[2]);
  if (!a && e && t[1] === 'lemma') a = { e, f: t[2], key: 'lemma', d: 'forma di citazione', req: [e.topic] };
  if (!a) return null;
  return SN.tok(a);
}
const packTok = (t) => (t.p ? [t.p] : [E.LEX.indexOf(t.a.e), t.a.key, t.a.f]);
const PRE = window.HERM_PRE || null;
const BANK = B.BANK.map((b, i) => {
  const declared = b[2].split(/\s+/);
  return { id: 'b' + i, gr: b[0], it: b[1].split('|'), tags: PRE ? PRE.bank[i].tags : declared, focus: declared.slice().sort((a, c) => ORDER.indexOf(c) - ORDER.indexOf(a))[0], tip: b[3] || '', src: 'bank', _tok: PRE ? PRE.bank[i].tok : null };
});
function tokensOf(s) {
  if (s.tokens) return s.tokens;
  if (s._tok) s.tokens = s._tok.map(resolveTok);
  if (!s.tokens || s.tokens.some((t) => !t)) { const lx = SN.lexicalize(s.gr); s.tokens = lx.tokens || []; }
  return s.tokens;
}
LS.init({ bank: BANK, tokensOf });
function sentById(id) {
  if (id[0] === 'b') return BANK[+id.slice(1)] || null;
  const g = (S.genSaved || []).find((x) => x.id === id);
  return g ? Object.assign({}, g, { tokens: g.tok.map(resolveTok) }) : null;
}

/* ---------- Progressi ---------- */
const RANKS = B.RANKS;
function todayXP() { return S.days[dayKey()] || 0; }
function effectiveStreak() {
  if (!S.lastDay) return 0;
  const gap = daysBetween(S.lastDay, dayKey());
  if (gap <= 1) return S.streak;
  return gap - 1 <= S.shields ? S.streak : 0;
}
function touchStreak() {
  const today = dayKey();
  if (S.lastDay === today) return false;
  const gap = S.lastDay ? daysBetween(S.lastDay, today) : 99;
  if (gap === 1) S.streak++;
  else if (gap > 1 && gap - 1 <= S.shields) { S.shields -= gap - 1; S.streak++; toastLater(`Uno scudo ha protetto la tua serie (${gap - 1} giorno saltato).`); }
  else S.streak = 1;
  S.lastDay = today;
  if (S.streak > 0 && S.streak % 7 === 0 && S.shields < 2) { S.shields++; toastLater('Nuovo scudo: protegge la serie se salti un giorno.'); }
  return true;
}
function addXP(n) { const before = rankOf(S.xp).i; S.xp += n; const k = dayKey(); S.days[k] = (S.days[k] || 0) + n; return rankOf(S.xp).i > before; }
function rankOf(xp) { let i = 0; RANKS.forEach((r, k) => { if (xp >= r.xp) i = k; }); return { i, r: RANKS[i], next: RANKS[i + 1] || null }; }
function recordMastery(t, ok) {
  if (!t) return;
  const m = S.mastery[t] || { a: 0, c: 0 };
  m.a++; if (ok) m.c++;
  if (m.a > 40) { m.a = Math.round(m.a * 0.8); m.c = Math.round(m.c * 0.8); }
  S.mastery[t] = m;
}
const doneUnits = () => UNITS.filter((u, ui) => (S.course.stars[FLAT[lastLessonIdx(ui)].lesson.id] || 0) > 0).length;
const BADGES = [

/* ---------- Suoni, vibrazione, voce, avvisi ---------- */
let actx = null;
function tone(freqs, dur = 0.12, type = 'sine', gain = 0.05) {
  if (!S.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    let t = actx.currentTime;
    for (const f of freqs) {

function bestItalianMatch(s, ans) {

function checkTypedGreek(refTokens, typed) {
  const lenient = S.settings.accents === 'lenient';

  const ans = SN.splitWords(typed).filter((w) => !SN.PUNCT.test(w));
  if (ans.length !== ref.length) return { ok: false, accent: [] };
  const variants = (x) => {
    const v = new Set([x.w, x.t.f]);

  (function dfs(k) {
    if (found) return;
    if (k === ans.length) { if (SN.orderOK(refTokens, assign.map((i) => ref[i].t.f))) found = assign.slice(); return; }
    for (const i of cand[k]) { if (used[i]) continue; used[i] = true; assign.push(i); dfs(k + 1); assign.pop(); used[i] = false; if (found) return; }
  })(0);

}

function doCheck() {

  let res = null;
  if (CHOICE.includes(it.type) && c.picked == null) return;
  if (it.type === 'gr_it') {
    if (c.inputMode === 'tiles') {
      if (!c.chosen.length) return;
      const built = c.chosen.map((k) => c.tiles[k].label).join(' ');
      const ok = it.s.it.some((r) => normIt(r) === normIt(built));
      res = { ok, sol: it.s.it[0], given: built, near: !ok && simLoose(normIt(built), normIt(it.s.it[0])) > 0.7 };
    } else {

      if (!ans) return toast('Scrivi la traduzione.');
      const m = bestItalianMatch(it.s, ans);
      if (m.best >= 0.88) res = { ok: true, sol: m.bestRef, given: ans, typed: true, note: normIt(ans) !== normIt(m.bestRef) ? 'Versione di riferimento: ' + m.bestRef : '' };

      const noDis = toks.every((t) => !t.distractor) && toks.length === ref.filter((t) => t && !t.p).length;
      const ok = noDis && SN.orderOK(ref, toks.map((t) => t.tok.f));
      const builtStr = SN.render(toks.map((t) => t.tok).concat([{ p: '.' }]));
      res = { ok, sol: it.s.gr, given: builtStr, greek: true, note: ok && G.strict(builtStr) !== G.strict(it.s.gr) ? 'Giusto: in greco l’ordine delle parole è libero. Ordine del testo: ' + it.s.gr : '' };
    } else {

const CASE_ROWS = [['nom', 'Nom.'], ['gen', 'Gen.'], ['dat', 'Dat.'], ['acc', 'Acc.'], ['voc', 'Voc.']];

  const t = ev.target;
  if ((t.id === 'typed' || t.id === 'q') && t.classList.contains('gr')) normalizeTyped(t, t.selectionStart ?? t.value.length);
  if (t.id === 'typed') { const b = $('#checkBtn'); if (b) b.disabled = !t.value.trim(); }
});
window.addEventListener('resize', closePop);
window.addEventListener('scroll', closePop, true);
function updateJump() {
  const j = $('#jump'), n = $('.node.current');
  if (!j || !n) return;
  const r = n.getBoundingClientRect();
  const off = r.bottom < 70 || r.top > innerHeight - 90;
  // in cima c'è già la scheda «Continua»: il pulsante serve solo dopo aver scorso il percorso
  const res = $('.resume');
  j.hidden = !off || (res && res.getBoundingClientRect().bottom > 0);
  j.classList.toggle('up', r.bottom < 70);
}
window.addEventListener('scroll', updateJump, { passive: true });

/* ---------- Avvio ---------- */
function warmLoop() {
  if (E.isReady()) return;
  const step = () => { E.warm(12); if (!E.isReady()) (window.requestIdleCallback || ((f) => setTimeout(f, 30)))(step); };
  setTimeout(step, 800);
}
function boot() {
  load();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* ignora */ }
  applyTheme();
  const mq = matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', applyTheme);
  render();
  warmLoop();
  try { if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } } catch (e) { /* ignora */ }
  if (SITE && 'serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
}
// per la verifica automatica nel browser
window.HermApp = { S: () => S, cur: () => SES && SES.cur, startLesson, startPractice, FLAT, ermes };
boot();
})();

</script>
